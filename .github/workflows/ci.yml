name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  install-target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install against a disposable Debian target
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-yaml openssl
            mkdir -p build/tmp
            export TMPDIR=/src/build/tmp
            bash tests/vws/install.test.sh
            bash tests/vws/install-container.sh
          '

  # Real etcd with the certificates vws install generates, reached over the etcd URL of the packaged units.
  etcd-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run the etcd suite on the pinned etcd
        run: |
          scripts/install-tools.sh
          PATH="/tmp/bin:$PATH" bash tests/vws/etcd.test.sh

  etcd-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate etcd package and Debian lifecycle
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git python3 lintian shellcheck curl openssl
            mkdir -p build/tmp
            export TMPDIR=/src/build/tmp
            packaging/vws-etcd/test.sh
            printf "#!/bin/sh\nexit 0\n" > build/etcd-stub
            chmod +x build/etcd-stub
            packaging/vws-etcd/build.sh 0.0.0-1 build/etcd-stub build
            packaging/vws-etcd/test-install.sh /src/build/vws-etcd_0.0.0-1_amd64.deb
          '

  global-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate global package
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git python3 python3-yaml lintian shellcheck curl
            mkdir -p build/tmp
            export TMPDIR=/src/build/tmp
            packaging/vws-global/test.sh
          '

  region-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate package and Debian lifecycle
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git python3 lintian shellcheck curl
            packaging/vws-region/test.sh
            mkdir -p build
            printf "#!/bin/sh\nexit 0\n" > build/region-stub
            chmod +x build/region-stub
            packaging/vws-region/build.sh 0.0.0-1 build/region-stub build
            packaging/vws-region/test-install.sh /src/build/vws-region_0.0.0-1_amd64.deb
          '

  # The real daemon, built from the console-api commit the release pins, must accept the flags the unit passes.
  region-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out the pinned console-api
        run: |
          source scripts/versions.env
          git init -q /tmp/console-api
          git -C /tmp/console-api fetch -q --depth 1 https://github.com/popododo0720/vws-console-api.git "$GLOBAL_CONSOLE_API_REF"
          git -C /tmp/console-api checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/console-api rev-parse HEAD)" = "$GLOBAL_CONSOLE_API_REF"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: /tmp/console-api/go.mod
          cache: false

      - name: Run the unit flags against the pinned daemon
        run: |
          (cd /tmp/console-api && CGO_ENABLED=0 go build -trimpath -o /tmp/vws-region ./cmd/vws-region)
          mkdir -p build/flags-test
          python3 packaging/vws-region/test-flags.py packaging/vws-region build/flags-test /tmp/vws-region

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF"

      - name: Check
        env:
          VWS_BASE_REF: ${{ github.base_ref }}
        run: make check

  # The compatibility matrix (vws-deploy#133) runs only when its own paths change.
  compat-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(tests/compat/|scripts/versions\.env$|\.github/workflows/compat\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  compat:
    needs: compat-changes
    if: needs.compat-changes.outputs.run == 'true'
    uses: ./.github/workflows/compat.yml
    with:
      target: fake
