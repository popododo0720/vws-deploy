name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  global-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate global package
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git python3 python3-yaml lintian shellcheck curl
            mkdir -p build/tmp
            export TMPDIR=/src/build/tmp
            packaging/vws-global/test.sh
          '

  region-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate package and Debian lifecycle
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:bookworm-slim sh -ec '
            apt-get update
            apt-get install -y --no-install-recommends git python3 lintian shellcheck sudo curl
            packaging/vws-region/test.sh
            mkdir -p build
            printf "#!/bin/sh\nexit 0\n" > build/region-stub
            chmod +x build/region-stub
            packaging/vws-region/build.sh 0.0.0-1 build/region-stub build/region-stub build
            packaging/vws-region/test-install.sh /src/build/vws-region_0.0.0-1_amd64.deb
          '

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "$BASE_REF"

      - name: Check
        env:
          VWS_BASE_REF: ${{ github.base_ref }}
        run: make check

  # The compatibility matrix (vws-deploy#133) runs only when its own paths change.
  compat-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only "$BASE" "$HEAD" | grep -qE '^(tests/compat/|scripts/versions\.env$|\.github/workflows/compat\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  compat:
    needs: compat-changes
    if: needs.compat-changes.outputs.run == 'true'
    uses: ./.github/workflows/compat.yml
    with:
      target: fake

  # Common golangci-lint baseline (.github/golangci-common.yml, vws-deploy#300), on the whole module (#302).
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          install-only: true

      - name: Lint
        run: golangci-lint run --timeout=5m ./...

      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff

  installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Prints the AGENTS.md rule and Judgment counts, then runs go test -v on the layer rules (R26).
      - name: Architecture test
        run: ../scripts/guard-agents.sh archtest ../AGENTS.md
