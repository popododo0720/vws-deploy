# After a merge, label each "Part of #N" issue whose acceptance criteria are not all ticked with
# evidence as ac-pending; the lead ticks them in a batch (vws-deploy#399, box skill vws-issue-ac).
# Writes labels only. Checks out the default branch's .github/ac and scripts/guard-agents.sh,
# never the PR head or merge ref.
name: post-merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  ac-pending:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # post-merge.sh reads refs with guard-agents.sh visible_text (vws-deploy#418); a file
          # pattern needs non-cone mode.
          sparse-checkout: |
            .github/ac
            scripts/guard-agents.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Label issues with open AC
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # A fork PR gets a read-only token; post-merge.sh logs a skip for it (vws-deploy#418).
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          PR_BODY_FILE="$RUNNER_TEMP/pr-body.md" .github/ac/post-merge.sh
