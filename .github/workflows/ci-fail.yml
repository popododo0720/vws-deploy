# CI-failure marker comment (vws-deploy#412). Reusable: each vws-* repo calls it from a thin caller
# on workflow_run completed (sample in docs/ci-fail.md). For a failed run on a same-repo PR head it
# posts one marker comment per head SHA, or edits it; the format and the 3-rework cap are in
# docs/ci-fail.md. The script reads the event file itself; no event field is put into a shell line.
name: ci-fail

on:
  workflow_call:

permissions: {}

jobs:
  marker:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    concurrency:
      group: vws-ci-fail-${{ github.repository }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # Fail closed when the pinned workflow commit is unknown (#432): an empty ref would make checkout
      # take the default branch. No token in this step.
      - name: Pinned workflow commit is known
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ${WORKFLOW_REPOSITORY:-} != popododo0720/vws-deploy ]]; then
            echo "ci-fail: job.workflow_repository is '${WORKFLOW_REPOSITORY:-}', not popododo0720/vws-deploy" >&2
            exit 1
          fi
          if ! [[ ${WORKFLOW_SHA:-} =~ ^[0-9a-f]{40}$ ]]; then
            echo "ci-fail: job.workflow_sha is '${WORKFLOW_SHA:-}', not a full commit SHA" >&2
            exit 1
          fi
      # The script runs from the same commit as this workflow file (the caller's @sha pin), never
      # from a branch (#402). tests/workflows/test_ci_fail_pin.py fails on any other ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: vws-deploy-ci-fail
          sparse-checkout: .github/ci-fail
          persist-credentials: false
      - name: Post or update the marker comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 vws-deploy-ci-fail/.github/ci-fail/ci_fail.py
