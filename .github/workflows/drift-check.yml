# Daily guardrail drift check across the vws-* repos (vws-deploy#300).
# GITHUB_TOKEN reads public repos, so branch protection comes from the branch summary and the
# rulesets API. That token cannot read a ruleset's bypass actors, so the ruleset cell says
# "unverified" for them; run .github/drift/drift-check.sh with an admin gh for the full classic
# protection settings and the bypass actors during an audit.
name: drift-check

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    # Check one PR head's repo-guard.yml on demand, e.g. a caller PR in another repo (vws-deploy#402).
    inputs:
      repo:
        description: "repo of the PR head to check (from repos.tsv); empty checks only the open PRs"
        required: false
        type: string
      sha:
        description: "40-hex head SHA of that PR"
        required: false
        type: string
  pull_request:
    paths:
      - AGENTS.md
      - .github/drift/drift-check.sh
      - .github/drift/**
      - .github/golangci-common.yml
      - .github/workflows/drift-check.yml
      - tests/drift/**
      - .github/workflows/repo-guard.yml
      - .github/workflows/repo-guard-*.yml
      # vendored.tsv pins its sha256 (#439 class 4); tests/drift checks a change against the pin.
      - .github/workflows/verify-queue.yml
      - scripts/guard-agents.sh
      - tests/workflows/**
      - .github/ac/**
      - .github/workflows/post-merge.yml
      - .github/orchestrate/**
      - tests/orchestrate/**
      - .github/ci-fail/**
      - .github/workflows/ci-fail.yml
      - tests/ci_fail/**
      - .github/metrics/**
      - tests/metrics/**
      - scripts/codex-round-count.sh
      - tests/codex/**
      # verify-check imports orchestrate.py; its tests use tests/orchestrate/stub_gh.py (vws-deploy#517 AC4).
      - .github/verify/**
      - tests/verify/**
      # trusted_read_lint.py reads every workflow (vws-deploy#439 class 1).
      - .github/workflows/**

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user pyyaml==6.0.2
      - name: Unit tests
        run: |
          python3 -m unittest discover -s tests/drift -v
          python3 -m unittest discover -s tests/workflows -v
          shellcheck .github/ac/*.sh
      # vws-deploy#439 class 1: no workflow reads event-snapshot labels or head_commit.committer, and
      # orchestrate.py matches markers only through .github/orchestrate/trusted_read.py.
      - name: Trusted-read lint
        run: python3 .github/drift/trusted_read_lint.py
      # The factory orchestrator (vws-deploy#333) reuses repos.tsv; its tests use a stub gh, no network.
      - name: Orchestrator unit tests
        run: |
          python3 -m unittest discover -s tests/orchestrate -v
          shellcheck .github/orchestrate/box/*.sh
      # CI-failure marker comment (vws-deploy#412); fake gh, no network.
      - name: CI-failure marker unit tests
        run: python3 -m unittest discover -s tests/ci_fail -v
      # Daily factory metrics (vws-deploy#345) import the orchestrator; stub gh, no network.
      - name: Metrics unit tests
        run: python3 -m unittest discover -s tests/metrics -v
      # Per-issue Codex round cap (vws-deploy#403); local files only, no network.
      - name: Codex round cap tests
        run: |
          python3 -m unittest discover -s tests/codex -v
          shellcheck scripts/codex-round-count.sh
      # Repeated verify checks (vws-deploy#517 AC4); stub gh and temp git repos, no network.
      - name: Verify check tests
        run: python3 -m unittest discover -s tests/verify -v
      - name: Compare every repo against the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          # The caller is checked at every open PR head, and also at the head named by the event: this
          # PR's head on pull_request, or the dispatch inputs. drift_check.py validates REPO=SHA.
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          IN_REPO: ${{ inputs.repo }}
          IN_SHA: ${{ inputs.sha }}
        # Exit 3 is drift, anything else non-zero is an error or a crash (Python exits 1 on a traceback).
        # The schedule fails on both. A pull request fails on an error or crash, but only warns on drift:
        # the other repos hold the published guard-agents.sh, so a PR that changes the canonical
        # checksum always drifts until it merges.
        run: |
          set +e
          heads=()
          if [[ $EVENT == pull_request ]]; then heads=(--head "vws-deploy=${PR_HEAD}"); fi
          if [[ -n $IN_REPO || -n $IN_SHA ]]; then heads+=(--head "${IN_REPO}=${IN_SHA}"); fi
          .github/drift/drift-check.sh --markdown "$RUNNER_TEMP/drift.md" "${heads[@]}"
          rc=$?
          if [[ -f "$RUNNER_TEMP/drift.md" ]]; then cat "$RUNNER_TEMP/drift.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [[ $rc -eq 3 && "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::warning::guardrail drift (see the job summary); the daily schedule fails on it"
            exit 0
          fi
          exit $rc
