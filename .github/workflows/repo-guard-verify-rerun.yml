# verify-rerun: a PR comment re-runs the gate job of the PR head's pull_request run.
# One of the four shared repo-guard jobs (vws-deploy#402), one job per file: GitHub validates the permissions
# of every job in a called file before any if:, so a file holds only jobs its caller job may grant.
# Every vws-* repo calls it from a short .github/workflows/repo-guard.yml pinned by full commit SHA;
# vws-deploy calls it from the same commit. docs/design/repo-guard-reusable.md has the trust model.
# The github, vars and token contexts are the caller's, with at most the caller job's permissions, and
# no secrets are passed.
name: repo-guard-verify-rerun

on:
  workflow_call:

permissions: {}

jobs:
  # A comment event runs on the default branch, and its check would not attach to the PR head. So this job
  # re-runs the verify-gate job of the newest pull_request run for the PR's current head; that job reads
  # the comments again. It checks out nothing and runs no PR code. It may only re-run jobs (actions: write)
  # and remove the verify-approved label when it cannot re-run the gate (issues and pull-requests: write).
  # The job to re-run is the called one, "<caller job> / verify-gate" (named "gate" in vws-deploy). The caller's
  # bare "verify-gate" shim depends on it, so GitHub re-runs the shim after it; re-running only the shim would
  # replay the old result. The bare name is taken only when no called job is listed: a repo still on the full
  # copy has its gate under that name, and a shim is listed only after the job it needs (vws-deploy#751).
  verify-rerun:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Re-run verify-gate for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Inlined from .github/gh-api-retry.sh. This job checks out nothing, so it cannot source that file.
          # Each gh api retries an installation or secondary rate limit, then fails closed.
          # BEGIN gh-api-retry
          gh_api_rate_limited() {
            local file=$1
            grep -E -q 'API rate limit exceeded|secondary rate limit|abuse detection mechanism|\(HTTP 429\)' "$file" && return 0
            jq -e '[.errors[]? | select(.type == "RATE_LIMITED")] | length > 0' "$file" >/dev/null 2>&1
          }

          gh_api_retry() {
            local attempts=${GH_API_RETRY_ATTEMPTS:-5}
            local delay=${GH_API_RETRY_DELAY:-5}
            local cap=${GH_API_RETRY_DELAY_CAP:-40}
            local n=1 rc out err limited
            [[ $attempts =~ ^[1-9][0-9]*$ ]] || attempts=5
            [[ $delay =~ ^[0-9]+$ ]] || delay=5
            [[ $cap =~ ^[1-9][0-9]*$ ]] || cap=40
            err=$(mktemp)
            while true; do
              rc=0
              limited=0
              out=$(gh api "$@" 2>"$err") || rc=$?
              if [[ $rc -ne 0 ]]; then
                printf '%s\n' "$out" >>"$err"
              elif printf '%s' "$out" | jq -e '[.errors[]? | select(.type == "RATE_LIMITED")] | length > 0' >/dev/null 2>&1; then
                printf '%s\n' "$out" >>"$err"
                rc=1
                limited=1
              else
                # Command substitution dropped the trailing newlines. Put one back when there is a body,
                # and write nothing when the call succeeded with an empty body. A blank line is a row to
                # the verify-queue awk (an empty commit-status list would look pending).
                if [[ -n $out ]]; then
                  printf '%s\n' "$out"
                fi
                rm -f "$err"
                return 0
              fi
              if [[ $limited -eq 0 ]] && gh_api_rate_limited "$err"; then
                limited=1
              fi
              if [[ $limited -eq 0 || $n -ge $attempts ]]; then
                cat "$err" >&2
                rm -f "$err"
                return "$rc"
              fi
              echo "gh api: rate limit, retry ${n}/$((attempts - 1)) in ${delay}s" >&2
              sleep "$delay"
              n=$((n + 1))
              if [[ $((delay * 2)) -gt $cap ]]; then
                delay=$cap
              else
                delay=$((delay * 2))
              fi
            done
          }
          # END gh-api-retry
          # Any path that does not re-run the gate drops verify-approved, so a changed or withdrawn verdict never
          # leaves an old green gate and label in place (vws-deploy#312). A label already gone is fine.
          give_up() {
            echo "$1" >&2
            if out=$(gh_api_retry -X DELETE "repos/${REPO}/issues/${NUMBER}/labels/verify-approved" 2>&1); then
              echo "verify-approved removed: the gate was not re-run; re-verify and label again" >&2
            elif [[ $out == *"HTTP 404"* ]]; then
              echo "verify-approved was not set" >&2
            else
              echo "$out" >&2
              echo "verify-approved could not be removed" >&2
            fi
            exit 1
          }
          # A failed lookup (after its rate-limit retries) is a gate not re-run, too.
          trap 'give_up "a GitHub API lookup failed (line ${LINENO})"' ERR
          pr=$(gh_api_retry "repos/${REPO}/pulls/${NUMBER}")
          head=$(jq -r '.head.sha' <<<"$pr")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_ref=$(jq -r '.head.ref' <<<"$pr")
          # Several PRs can share a head SHA, so the run is picked by this PR, never by the SHA alone: a run that
          # lists this PR number, or, for a fork PR (whose runs list no pull_requests), a run from the PR's own
          # head repo and branch. The list is newest first.
          # The branch name goes to jq as data (--arg); a ref may contain a quote.
          runs=$(gh_api_retry "repos/${REPO}/actions/workflows/repo-guard.yml/runs?event=pull_request&head_sha=${head}&per_page=100")
          run=$(jq -r --argjson n "$NUMBER" --arg repo "$REPO" --arg hr "$head_repo" --arg ref "$head_ref" \
            '[.workflow_runs[] | select(any(.pull_requests[]?; .number == $n)
              or ((.pull_requests | length) == 0 and $hr != "" and $hr != $repo
                  and .head_repository.full_name == $hr and .head_branch == $ref))][0].id // empty' <<<"$runs")
          [[ -n $run ]] || give_up "no pull_request run of PR #${NUMBER} for ${head}"
          status=
          # A job that is still running cannot be re-run yet: wait for it (up to 15 minutes), then re-run.
          # The job is looked up again each time: the run's jobs list is its newest attempt, and another re-run
          # can start a newer attempt meanwhile; only a job of the newest attempt can be re-run.
          # A run that is still queued or starting lists no gate job yet (vws-storage run 42648041338, read 4s
          # after it was created): wait for it like a running job. Only a finished run without one gives up.
          for _ in $(seq 1 30); do
            job=$(gh_api_retry "repos/${REPO}/actions/runs/${run}/jobs?per_page=100" --jq \
              '[.jobs[] | select(.name | endswith(" / verify-gate"))][0].id
               // [.jobs[] | select(.name == "verify-gate")][0].id // empty')
            if [[ -z $job ]]; then
              status=$(gh_api_retry "repos/${REPO}/actions/runs/${run}" --jq '.status')
              [[ $status != completed ]] || give_up "run ${run} has no verify-gate job"
              echo "run ${run} lists no verify-gate job yet (status ${status}); waiting"
              sleep 30
              continue
            fi
            status=$(gh_api_retry "repos/${REPO}/actions/jobs/${job}" --jq '.status')
            if [[ $status == completed ]]; then
              if out=$(gh_api_retry -X POST "repos/${REPO}/actions/jobs/${job}/rerun" 2>&1); then
                echo "verify-gate job ${job} re-run"; exit 0
              fi
              # A newer attempt took over: look again. Its run is still running (another job of it, or the run
              # the verdict's label event started; vws-deploy#721): wait for it to finish, then re-run. Any other
              # refusal (HTTP 4xx, such as a run past its re-run window) does not change by waiting. A server
              # error is retried.
              if [[ $out == *"current attempt"* ]]; then
                echo "verify-gate job ${job} is no longer the newest attempt; looking again"
              elif [[ $out == *"already running"* ]]; then
                echo "the run of verify-gate job ${job} is still running; waiting to re-run it"
              elif [[ $out == *"(HTTP 4"* ]]; then
                give_up "verify-gate job ${job} cannot be re-run: ${out}"
              else
                echo "verify-gate job ${job} re-run failed, retrying: ${out}"
              fi
            fi
            sleep 30
          done
          give_up "verify-gate job ${job:-of run ${run}} could not be re-run within 15 minutes (status ${status})"
