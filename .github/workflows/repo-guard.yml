# Common insider-risk workflow for pull requests. Copy this file, direct-push-watch.yml and
# scripts/guard-agents.sh as-is into another repo.
# The repo is private on a free plan, so branch protection is unavailable. These checks replace it.
# The push check lives in its own file so that a pull request run has no skipped check.
name: repo-guard

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Base is the main branch
        env:
          GUARD_MAIN_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.base_ref }}
        run: scripts/guard-agents.sh pr-base "$BASE_REF"
      - name: Body says Part of #N and closes no issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/guard-agents.sh pr-body
      - name: No commit closes an issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/guard-agents.sh pr-commits "$BASE_SHA" "$HEAD_SHA"
      - name: guard-agents.sh is the canonical vws-deploy copy
        run: scripts/guard-agents.sh identity scripts/guard-agents.sh.sha256
      - name: AGENTS.md has the guardrails
        run: scripts/guard-agents.sh agents
