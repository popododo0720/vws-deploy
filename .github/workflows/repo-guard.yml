# Caller of the shared repo-guard jobs, one file each; other repos pin a 40-hex SHA (docs/design/repo-guard-reusable.md).
name: repo-guard
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  hygiene:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/repo-guard-pr-hygiene.yml
    permissions: {contents: read, pull-requests: read}
  gate:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/repo-guard-verify-gate.yml
    permissions: {contents: read, pull-requests: read, issues: read}
  reset:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    uses: ./.github/workflows/repo-guard-verify-reset.yml
    permissions: {issues: write, pull-requests: write}
  rerun:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    uses: ./.github/workflows/repo-guard-verify-rerun.yml
    permissions: {actions: write, pull-requests: read}
  # The required checks are bare names, and a called job reports as "caller / called", so shims carry them.
  pr-hygiene:
    needs: hygiene
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: [{env: {R: "${{ needs.hygiene.result }}/${{ needs.hygiene.outputs.passed }}"}, run: test "$R" = success/pr-hygiene}]
  verify-gate:
    needs: gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: [{env: {R: "${{ needs.gate.result }}/${{ needs.gate.outputs.passed }}"}, run: test "$R" = success/verify-gate}]
