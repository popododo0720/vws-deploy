# Example only. Not applied to any cluster; the values must be confirmed in the T2 lab (unverified).
machine:
  network:
    interfaces:
      - interface: eth0
        dhcp: true
        vip:
          ip: 10.0.0.10
  kernel:
    modules:
      - name: openvswitch
      - name: geneve
      - name: rbd
cluster:
  allowSchedulingOnControlPlanes: false
  network:
    cni:
      name: none
