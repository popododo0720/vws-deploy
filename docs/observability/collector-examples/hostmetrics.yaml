# Node CPU, memory, load, disk, filesystem, network and paging: one collector per VM or bare-metal host.
# Needs: nothing beyond a collector running on the host itself (root_path is /), no API rights. The
#   process scraper stays off because it needs more rights.
# Stability: hostmetrics receiver metrics beta, logs development (collector-contrib README, 2026-10-12).
receivers:
  hostmetrics:
    root_path: /
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      disk: {}
      filesystem: {}
      network: {}
      paging: {}
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
exporters:
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true
service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlp]
