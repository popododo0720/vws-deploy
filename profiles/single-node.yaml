# Profile single-node: helm -f profiles/single-node.yaml on top of charts/vws/values.yaml.
# NO DATA PROTECTION: Ceph keeps one copy (platform/rook-ceph-cluster.single-node.values.yaml).
# Two stateless replicas still run, on the one node (the schema minimum, vws-deploy#43 decision 1).
# A profile changes values only, and every profile sets the same keys (scripts/guard.sh profiles).
# cpu and memory are requests and limits and are ESTIMATES until measured in a lab (T2).
global:
  profile: single-node
  topologySpread: soft
services:
  console:
    replicas: 2
    cpu: 100m
    memory: 256Mi
  console-api:
    # One replica in every profile: sessions are held in memory (popododo0720/vws-console-api#95).
    replicas: 1
    cpu: 100m
    memory: 256Mi
  # Stateful services run one replica: the services have no multi-replica state (vws-deploy#43 decision 2).
  compute:
    cpu: 100m
    memory: 256Mi
    state:
      size: 20Gi
  storage:
    cpu: 100m
    memory: 256Mi
    state:
      size: 20Gi
  network:
    cpu: 100m
    memory: 256Mi
    state:
      size: 20Gi
