# Profile ha: helm -f profiles/ha.yaml on top of charts/vws/values.yaml.
# A profile changes values only, and every profile sets the same keys (scripts/guard.sh profiles).
# cpu and memory are requests and limits and are ESTIMATES until measured in a lab (T2).
global:
  profile: ha
  topologySpread: hard
services:
  console:
    replicas: 3
    cpu: 500m
    memory: 1Gi
  console-api:
    # One replica in every profile: sessions are held in memory (popododo0720/vws-console-api#95).
    replicas: 1
    cpu: 500m
    memory: 1Gi
  # Storage and network run one replica: they have no multi-replica state (vws-deploy#43 decision 2).
  compute:
    # Two replicas share the kube store; default 2 also in ha (vws-deploy#723).
    replicas: 2
    cpu: 500m
    memory: 1Gi
  storage:
    cpu: 500m
    memory: 1Gi
    state:
      size: 20Gi
  network:
    cpu: 500m
    memory: 1Gi
    state:
      size: 20Gi
