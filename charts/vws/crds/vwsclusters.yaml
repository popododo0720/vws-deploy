# VWSCluster: the deployment settings of one VWS install, and the only VWS CRD (AGENTS.md R18,
# docs/vwscluster.md). spec.group below is the one place the API group is written; scripts read it
# from here. It is temporary until a domain is secured (vws-deploy#43 decision 9).
# No controller watches it. No service reads it. It holds no secret, only Secret names.
# Helm installs files in crds/ once and never deletes them, so an uninstall keeps the CR.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vwsclusters.vws.popododo0720.io
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: vws.popododo0720.io
  scope: Namespaced
  names:
    kind: VWSCluster
    listKind: VWSClusterList
    plural: vwsclusters
    singular: vwscluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profile
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Applied
          type: integer
          jsonPath: .status.observedGeneration
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name == 'vws'
              message: VWSCluster is a singleton named vws
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [profile]
              properties:
                profile:
                  type: string
                  enum: [single-node, small, ha]
                version:
                  description: Image tag of every VWS service. Empty means the chart appVersion.
                  type: string
                  pattern: '^$|^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
                storage:
                  type: object
                  properties:
                    driver:
                      type: string
                      description: rook-ceph (default), existing (any CSI StorageClass the cluster already has), or nfs (an existing NFS export through csi-driver-nfs, vws-storage#72).
                      enum: [rook-ceph, existing, nfs]
                    storageClass:
                      description: The StorageClass to use when driver is existing.
                      type: string
                      pattern: '^$|^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'
                    volumeMode:
                      description: volumeMode of new volumes when driver is existing. Block (default), or Filesystem for a provisioner without block volumes (needs CDI). nfs is always Filesystem.
                      type: string
                      enum: [Block, Filesystem]
                    nfs:
                      description: The NFS export when driver is nfs. It must already exist and be mountable from every node.
                      type: object
                      required: [server, share]
                      properties:
                        server:
                          description: Host name or IP address of the NFS server.
                          type: string
                          pattern: '^[A-Za-z0-9]([A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$'
                        share:
                          description: Exported path, for example /export/vws.
                          type: string
                          pattern: '^/[^\s]*$'
                    s3:
                      type: object
                      properties:
                        rgw:
                          description: RGW object backend of vws-storage (vws-deploy#108). Rendered into services.storage.s3.rgw. The keys stay in the Secret existingSecret in the release namespace.
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            endpoint:
                              type: string
                              pattern: '^$|^https?://[^\s]+$'
                            bucketPrefix:
                              type: string
                              pattern: '^([a-z0-9][a-z0-9-]{0,17})?$'
                            existingSecret:
                              description: Name of the Secret with keys access-key and secret-key. Never a value.
                              type: string
                              pattern: '^$|^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'
                network:
                  type: object
                  properties:
                    driver:
                      type: string
                      enum: [kube-ovn]
                    vmMTU:
                      description: MTU vws-network hands VPC VMs by DHCP (-vm-mtu, vws-network#93). Unset is 9001 (AWS), lowered to underlayMTU minus the tunnel overhead. vws preflight writes the lowered value here. Traffic leaving through IGW, NAT or EIP is 1500 on the vws-network side.
                      type: integer
                      minimum: 68
                      maximum: 9001
                    underlayMTU:
                      description: MTU of the node NIC the tunnel rides on, as the OS already set it. vws preflight writes what it read (--links). The installer never changes a NIC MTU. Needs vmMTU plus the overhead, 9101 for 9001; 9216 is recommended.
                      type: integer
                      minimum: 1280
                      maximum: 9216
                    tunnelOverhead:
                      description: Bytes the geneve tunnel adds. Unset is 100, or 60 with ipv4Only.
                      type: integer
                      minimum: 0
                      maximum: 200
                    ipv4Only:
                      description: The underlay is IPv4 only, so an unset tunnelOverhead is 60 instead of 100.
                      type: boolean
                    nodes:
                      description: Node NICs per network (vws-deploy#125). Omitted means one NIC, the current behavior. It describes host networking the OS already set up.
                      type: object
                      required: [management]
                      properties:
                        management:
                          type: object
                          required: [nic, cidr]
                          properties:
                            nic:
                              description: Node NIC name, the same on every node.
                              type: string
                              pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                            vlan:
                              description: 802.1Q id, 0 is untagged.
                              type: integer
                              minimum: 0
                              maximum: 4094
                            cidr:
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                            mtu:
                              type: integer
                              minimum: 1280
                              maximum: 9216
                        tunnel:
                          type: object
                          required: [nic, cidr]
                          properties:
                            nic:
                              description: Node NIC name, the same on every node.
                              type: string
                              pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                            vlan:
                              description: 802.1Q id, 0 is untagged.
                              type: integer
                              minimum: 0
                              maximum: 4094
                            cidr:
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                            mtu:
                              type: integer
                              minimum: 1280
                              maximum: 9216
                        storage:
                          type: object
                          required: [public]
                          properties:
                            public:
                              type: object
                              required: [nic, cidr]
                              properties:
                                nic:
                                  description: Node NIC name, the same on every node.
                                  type: string
                                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                                vlan:
                                  description: 802.1Q id, 0 is untagged.
                                  type: integer
                                  minimum: 0
                                  maximum: 4094
                                cidr:
                                  type: string
                                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                                mtu:
                                  type: integer
                                  minimum: 1280
                                  maximum: 9216
                            cluster:
                              type: object
                              required: [nic, cidr]
                              properties:
                                nic:
                                  description: Node NIC name, the same on every node.
                                  type: string
                                  pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                                vlan:
                                  description: 802.1Q id, 0 is untagged.
                                  type: integer
                                  minimum: 0
                                  maximum: 4094
                                cidr:
                                  type: string
                                  pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                                mtu:
                                  type: integer
                                  minimum: 1280
                                  maximum: 9216
                        external:
                          type: object
                          required: [nic, cidr, gateway, eipPool]
                          properties:
                            nic:
                              description: Node NIC name, the same on every node.
                              type: string
                              pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                            vlan:
                              description: 802.1Q id, 0 is untagged.
                              type: integer
                              minimum: 0
                              maximum: 4094
                            cidr:
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                            mtu:
                              type: integer
                              minimum: 1280
                              maximum: 9216
                            gateway:
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                            excludeIPs:
                              description: Addresses or a..b ranges Kube-OVN never assigns.
                              type: array
                              items:
                                type: string
                                pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}(\.\.([0-9]{1,3}\.){3}[0-9]{1,3})?$'
                            eipPool:
                              description: Elastic IP pool inside cidr. Required, no default.
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                            gatewayNodes:
                              description: Nodes vws-network keeps at ovn.kubernetes.io/external-gw=true (-kube-gateway-nodes). Omit to leave the labels alone.
                              type: array
                              minItems: 1
                              items:
                                type: string
                                pattern: '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$'
                    direct:
                      description: Provider networks that VM ports join directly through a Kube-OVN underlay (vws-deploy#125).
                      type: array
                      items:
                        required: [name, nic, cidr, gateway]
                        type: object
                        properties:
                          nic:
                            description: Node NIC name, the same on every node.
                            type: string
                            pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.:-]{0,14}$'
                          vlan:
                            description: 802.1Q id, 0 is untagged.
                            type: integer
                            minimum: 0
                            maximum: 4094
                          cidr:
                            type: string
                            pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
                          mtu:
                            type: integer
                            minimum: 1280
                            maximum: 9216
                          name:
                            type: string
                            pattern: '^[a-z][a-z0-9-]{0,14}$'
                          mode:
                            description: Only ovn-underlay. sriov and macvtap are reserved extension points.
                            type: string
                            enum: [ovn-underlay]
                          gateway:
                            type: string
                            pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
                          excludeIPs:
                            description: Addresses or a..b ranges Kube-OVN never assigns.
                            type: array
                            items:
                              type: string
                              pattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}(\.\.([0-9]{1,3}\.){3}[0-9]{1,3})?$'
                observability:
                  type: object
                  properties:
                    otlpEndpoint:
                      description: Empty turns telemetry off. Not rendered until the chart has observability values.
                      type: string
                services:
                  description: Per-service overrides, checked again by charts/vws/values.schema.json.
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      replicas:
                        type: integer
                        minimum: 1
                      cpu:
                        type: string
                      memory:
                        type: string
                      flags:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                secrets:
                  description: Names of Secrets the installer created. Never a value.
                  type: object
                  additionalProperties:
                    type: object
                    required: [secretName]
                    properties:
                      secretName:
                        type: string
                        pattern: '^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$'
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                appliedValuesHash:
                  type: string
                specHistory:
                  description: Specs whose helm revision description holds only their hash (too long to record in full). Newest last, at most 10. Written by vws apply, read by vws rollback.
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [specHash, spec]
                    properties:
                      specHash:
                        type: string
                      spec:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
