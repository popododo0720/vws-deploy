# The services map is the only control-plane roster.
# Add a service by adding one key. Do not add a template for it.
# Presence of state makes a StatefulSet with one retained volume.
# Absence of state makes a Deployment with at least two replicas.
# namespaces is the only place a namespace name is written. Everything else names a key of it:
# an rbac rule's namespace, and a flag value {namespace: <key>}. "release" is the release namespace.
# Every namespace key used by a rule is created by the chart and kept on uninstall
# (helm.sh/resource-policy: keep, so an uninstall never deletes VM disks; the cost is manual
# cleanup, see docs/service-config.md).
# flags are the service's command-line flags, rendered as -name=value args. A flag value is a string,
# boolean, integer, or {namespace: <key>}. Flags only, no env. docs/service-config.md lists each flag
# and the service code it comes from.
# pendingFlags are flags that the service images on main do not accept yet. They are rendered only
# when global.pendingFlags is true, so the default chart does not crash current images.
# rbac is the service's Kubernetes API access: a list of rules, no wildcards.
# A rule with a namespace becomes a Role in that namespace. A rule without one goes
# into a ClusterRole and may name only cluster-scoped resources (scripts/check_render.py).
# The rules are the calls the service code makes, see docs/rbac.md.
# A service with rbac also gets a Lease Role named after it for leader election.
global:
  registry: ghcr.io/popododo0720/vws
  storageClass: ""
  pendingFlags: false
  # How kubelet checks every service: tcp opens the service port. grpc calls grpc.health.v1 on it
  # and works only after the service images implement that. Switching is this one value.
  probe: tcp
  # How replicas of a service spread over nodes: soft prefers different nodes (ScheduleAnyway),
  # hard requires them (DoNotSchedule). profiles/ha.yaml sets hard. profiles/*.yaml also set
  # global.profile, which only records the profile a render came from.
  topologySpread: soft
  # tag is the image tag of every service. Absent means Chart.yaml appVersion. vws render sets it
  # from VWSCluster spec.version.
  # metricsScraper: the only pods that reach /metrics on a service with scrapeMetrics: true.
  # namespace is a key of namespaces. A service sets scrapeMetrics once its image serves /metrics on
  # healthPort (vws-lib obs, OTEL_METRICS_EXPORTER=prometheus); see docs/service-config.md (#620).
  metricsScraper:
    namespace: monitoring
    podLabels:
      app.kubernetes.io/name: prometheus

# observability (vws-deploy#50, design docs/design/observability.md) is off by default; off renders
# nothing new. enabled is the only switch. On, every service gets the OTel env of vws.otelEnv
# (_helpers.tpl): OTEL_SERVICE_NAME, the OTLP endpoint and protocol, the sampler, resource
# attributes, VWS_LOG_LEVEL and, from Secrets only, OTEL_EXPORTER_OTLP_HEADERS and SENTRY_DSN.
# otlpEndpoint empty: the chart runs one minimal collector (otel-collector, OTLP in, memory_limiter
# and batch, otlp and debug out, no API rights) and the services send to it. otlpEndpoint set: no
# collector, and the services send there. defaults hold every key; services.<name>.observability
# may set any of the same keys and nothing else (values.schema.json). A Secret key is fixed by the
# chart (headers, dsn, authorization); only the Secret name is a value.
observability:
  enabled: false
  otlpEndpoint: ""
  # A Secret with key headers (W3C list, such as authorization=Bearer%20x) for an external endpoint.
  otlpHeadersSecret: ""
  defaults:
    protocol: grpc
    sampler: parentbased_traceidratio
    samplerArg: "0.1"
    logLevel: info
    resourceAttributes: {}
    sentry:
      enabled: false
      dsnSecret: ""
  collector:
    # otel/opentelemetry-collector-contrib OTELCOL_VERSION (scripts/versions.env), multi-arch index
    # digest from Docker Hub on 2026-11-05. scripts/guard.sh observability checks the tag.
    image: docker.io/otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    cpu: 100m
    memory: 512Mi
    exporters:
      # endpoint empty sends nothing on; debug then has to stay on. authorizationSecret: a Secret
      # with key authorization, sent as the authorization header.
      otlp:
        endpoint: ""
        insecure: false
        authorizationSecret: ""
      debug:
        enabled: true

namespaces:
  vms: vws-vms
  images: vws-images
  nad: vws-nad
  # The Prometheus namespace. The chart never creates it (no rbac rule names it); only the
  # metrics NetworkPolicy selects it by its kubernetes.io/metadata.name label.
  monitoring: monitoring

services:
  # vws-iam (vws-iam#1, #243): users, policies, SigV4 Authenticate and Authorize for console-api.
  # The vws-iam binary's -listen default is 127.0.0.1:9095. -health-listen stays 127.0.0.1:9096 and
  # is not passed. kekSecret: the key-encryption key of
  # access-key secrets and TOTP seeds comes by secretKeyRef as env VWS_IAM_KEK / VWS_IAM_KEK_ID,
  # never in args or values; vws apply creates the Secret once and never rotates it. allowFrom: a
  # NetworkPolicy admits only console-api. State: every replica reads and writes the vws-iam kube store,
  # the custom resources of charts/vws/crds/iam.yaml (a copy of vws-iam deploy/crds/iam.yaml) in the
  # release namespace, so no volume holds state (#369). -namespace selects that store; without it the
  # image keeps state in process memory (vws-iam cmd/vws-iam/main.go openStore).
  iam:
    enabled: false
    port: 9095
    flags:
      listen: 0.0.0.0:9095
      namespace: {namespace: release}
    # The calls of vws-iam internal/store/kubestore (uncached client, CAS on resourceVersion): get,
    # list, create, update and delete of its own resources, no watch, patch or status subresource.
    # Same list as vws-iam main deploy/rbac/role.yaml (#243); render.test.sh checks it against crds/iam.yaml.
    rbac:
    - namespace: release
      apiGroups: [iam.vws.popododo0720.io]
      resources: [iamusers, iamgroups, iamroles, iampolicies, iamaccesskeys, iammfadevices, iamaccesskeyindexes, iamsessions, iamoperations, iamreplayentries, iamattemptcounters, iamgroupmembershiplocks, iamfidodevices, iaminstanceprofiles, iamaccountaliases, iamaccountaliasclaims, iamaccountpasswordpolicies]
      verbs: [get, list, create, update, delete]
    # imageTag pins iam to one published build (vws-deploy#280 mechanism). sha-74a29dc is
    # vws-iam#113. vws-iam publish.yml pushed
    # ghcr.io/popododo0720/vws/iam:sha-74a29dc
    # (sha256:6c301b75fd46584fd4d6c86f77be9d4389e0492a210d34bc31ab5a34fb9acc5d, revision 74a29dc).
    # An anonymous manifest request for that tag returned HTTP 200 and this digest on 2026-10-16.
    # The image binary contains go1.26.9. spec.version does not move it. enabled stays false, so the
    # default render still leaves iam out.
    imageTag: sha-74a29dc
    # Two replicas share the kube store, so a write on one is read on the other and survives a restart.
    replicas: 2
    kekSecret: vws-iam-kek
    allowFrom: [console-api]
  # admin (vws-deploy#391 AC3, docs/design/admin-volume-types.md): the page that lists and edits the
  # EBS volume type mapping. It is `vws-installer admin`, a subcommand of the installer image, so
  # imageName names that repository and command replaces the image entrypoint (scripts/vws). loopback:
  # the page has no auth of its own and listens on 127.0.0.1 only, so the chart renders no Service and
  # the NetworkPolicy admits only the health port for kubelet probes. It runs as a one-replica StatefulSet
  # so the pod is admin-0, and the operator reaches the page with kubectl port-forward pod/admin-0 through
  # Role admin-portforward, which the cluster admin binds (docs/vwscluster.md). enabled stays false because the installer package on GHCR is private
  # (an anonymous token request answers "authentication required" on 2026-11-09), the same as iam: it
  # needs a public package or an image pull secret first.
  admin:
    enabled: false
    loopback: true
    imageName: installer
    command: [/opt/vws/bin/vws-installer, admin]
    # sha-d543fa6 is vws-deploy main at d543fa6. installer-publish run 42644159420 pushed
    # ghcr.io/popododo0720/vws/installer:sha-d543fa640b164ec436a3cda9c6217a18e00ddc4b
    # (index digest sha256:fed9ac13593da64b234740643f6faf1249fe09e222e02536ab6369ba75ab2bad) on 2026-11-09.
    imageTag: sha-d543fa640b164ec436a3cda9c6217a18e00ddc4b
    port: 8080
    # /healthz and /readyz come from obs.Setup on VWS_HEALTH_ADDR (vws-lib), a port apart from the page.
    healthPort: 8081
    flags:
      listen: 127.0.0.1:8080
      namespace: {namespace: release}
    # The kubectl calls of installer/internal/cluster/admin.go and installer/internal/admin/admin.go.
    # VWSCluster vws: get for the page and its resourceVersion, patch for the save (--type=json, no
    # create, so resourceNames holds). The group is read from crds/vwsclusters.yaml (R18).
    rbac:
    - namespace: release
      apiGroups: [{crd: vwsclusters}]
      resources: [vwsclusters]
      resourceNames: [vws]
      verbs: [get, patch]
    # The save patches /data of the ConfigMap the chart renders and never creates it. kubectl patch
    # gets the object before it sends the patch (kubectl v1.35.0), so the rule needs get too.
    - namespace: release
      apiGroups: [""]
      resources: [configmaps]
      resourceNames: [vws-volume-types]
      verbs: [get, patch]
    # check and the page's class list: `get storageclasses` and `get volumesnapshotclasses` are lists
    # (-o jsonpath over .items), so the verb is list.
    - apiGroups: [storage.k8s.io]
      resources: [storageclasses]
      verbs: [list]
    - apiGroups: [snapshot.storage.k8s.io]
      resources: [volumesnapshotclasses]
      verbs: [list]
  console:
    external: true
    # portEnv names the env the image reads its listen port from (the Next.js server reads PORT). The
    # value is this service's port, the same as containerPort, the probe and the Service.
    portEnv: PORT
    # httpProbes (vws-deploy#612): the console serves GET /healthz (process up) and GET /readyz
    # (ready for traffic) on its app port, the `http` container port, unauthenticated
    # (vws-console#117). Kubelet probes them with httpGet: /healthz for startup (5s period, 2s
    # timeout) and liveness (10s, 2s, 3 failures), /readyz for readiness (5s, 2s, 2 failures), the
    # same timings as every other service (vws.probes). GET /metrics (Prometheus, vws_console_
    # prefix) is on the same port; the scrape restriction is a separate step of #612.
    httpProbes: true
    # imageTag pins the console to vws-console main c668c6f (vws-console#117 merged 2026-10-30),
    # the first build with /healthz, /readyz and /metrics. vws-console publish.yml pushed
    # ghcr.io/popododo0720/vws/console:sha-c668c6f
    # (sha256:37a1a2f5a3b9499d42ee366da2f9c373ab0b907fe9ec157654efa9fba17d67f5); an anonymous
    # manifest request returned HTTP 200 and this digest on 2026-11-02. An older image answers 404
    # on /healthz, so these probes need this pin or later.
    imageTag: sha-c668c6f
    # apiClient wires this service to another service's console surface: env VWS_CONSOLE_API_URL is
    # http://<service>.<release namespace>.svc:<that service's port>, and VWS_CONSOLE_API_TOKEN comes by
    # secretKeyRef from key console-token of that service's apiCredentials.existingSecret. The token
    # is the only credential the client gets; the SigV4 keys stay with console-api.
    apiClient:
      service: console-api
  console-api:
    external: true
    # imageTag pins this service's image to one build instead of global.tag / Chart appVersion
    # (vws-deploy#280). sha-d3a4057 is console-api main on 2026-10-23 (#325): with -iam=grpc it
    # serves CreateUser, ListUsers and the other IAM user and group actions over vws-iam gRPC, which
    # the previous pin sha-c09cba3 answered with InvalidAction (vws-deploy#310). It keeps #299
    # (AttachVolume answers attaching) and #302 (DetachVolume replay records). The three commits
    # since c09cba3 add no flag and no env read, so the chart's flags and env do not change. It
    # reads VWS_CONSOLE_TOKEN, VWS_ACCESS_KEY and VWS_SECRET_KEY from env and makes no Kubernetes API
    # call, so it needs no Role. Its vendored vws/iam/v1 user, group, auth and access key protos
    # equal those of the iam pin sha-74a29dc. vws-console-api publish.yml pushed
    # ghcr.io/popododo0720/vws/console-api:sha-d3a4057
    # (sha256:48fc6ba1544ada28ecba5c244e9bd0f12e189ff0b12d849ed3e704f5e8853983); an anonymous
    # manifest request returned HTTP 200 and this digest on 2026-11-06. spec.version does not move
    # it. Moving this past vws-console-api ac413c5 (#457) also moves compute.imageTag; see
    # docs/image-pins.md.
    imageTag: sha-d3a4057
    # Exactly one replica: console-api holds sessions in memory, so a second pod or an HPA would
    # split them (popododo0720/vws-console-api#95). A one-replica Deployment is rendered with
    # strategy Recreate, so a rollout stops the old pod before the new one starts. The schema,
    # check_render.py (R4) and vws render refuse any other count; the chart has no HPA. Change this
    # only with shared session storage.
    replicas: 1
    # apiCredentials: env VWS_CONSOLE_TOKEN, VWS_ACCESS_KEY and VWS_SECRET_KEY from secretKeyRef of
    # existingSecret (keys console-token, access-key, secret-key) in the release namespace. No
    # credential flag is passed, so no value is in values, args, the pod spec or the process
    # arguments. Needs a console-api build that reads the env (S1). -backend=grpc refuses to start
    # without all three. vws apply creates the Secret once with random values when it is missing.
    apiCredentials:
      existingSecret: vws-console-api-credentials
    # rootPasswordSecret (vws-deploy#208): Secret vws-initial-admin, keys username (root) and
    # password. vws apply creates it once with a random 24-character password when sign-in is on,
    # before helm, and never rotates it; the installer hands it out once (POST /result/credential).
    # Only when flags.iam is fake or grpc (console sign-in on), the chart mounts the password key
    # read-only and passes the derived -root-password-file, so user root signs in with it. With the
    # default -iam static, sign-in is off and nothing renders. The schema allows only this name, the
    # one the installer and vws installer finish read. See docs/design/initial-admin.md.
    rootPasswordSecret: vws-initial-admin
    # Image defaults are -backend=fake and 127.0.0.1 listeners (vws-console-api
    # cmd/vws-console-api/main.go:40-50), so the default render served a fake cloud that the
    # Service could not reach (#84). Backend addresses are the in-namespace Service names.
    # console-origins (required, no default; vws-console-api#137 / 5b42eb7+): the browser origin(s)
    # of the console, comma-separated scheme://host[:port], such as https://console.example.
    # Sign-in and cookie writes from any other Origin return 403. On a default install (-iam=static)
    # Bearer calls still work when this is set to the console URL (vws-test: all 200, no login).
    # The console Service is a LoadBalancer, so the address is only known to the operator: set
    # spec.services.console-api.flags.console-origins. Needs a console-api image from #137
    # (5b42eb7) or later (unknown -console-origins / -trusted-proxies refuse to start).
    # trusted-proxies (optional, comma-separated IPs or CIDRs; in #137 / 5b42eb7+) is passed only
    # when set.
    flags:
      backend: grpc
      console-addr: 0.0.0.0:8080
      compute-addr: compute:50051
      storage-addr: storage:7400
      network-addr: network:8080
  compute:
    external: true
    # imageTag pins compute to one published build (vws-deploy#280 mechanism). sha-1b62a87 is
    # vws-compute main on 2026-10-22: it includes 89f2ca3 (#111), which maps attach device names to
    # valid KubeVirt disk names, and a31223a (#93), which labels image DataSources for authorization.
    # vws-compute publish.yml pushed ghcr.io/popododo0720/vws/compute:sha-1b62a87
    # (sha256:a8d7e7aa…, revision 1b62a87) on merge. ko sets the entrypoint /ko-app/vws-compute,
    # user 65532; this chart passes only args, never command. spec.version does not move it.
    # console-api at or after vws-console-api ac413c5 needs this at or after vws-compute f609a2e
    # (docs/image-pins.md).
    imageTag: sha-1b62a87
    # port is the container port and, through flags.listen, the gRPC listen port.
    # scripts/guard.sh config fails when they differ.
    port: 50051
    # healthPort is the second, HTTP listener of vws-compute. The chart sets env
    # VWS_HEALTH_ADDR=0.0.0.0:<healthPort>, names the container and Service port metrics, and
    # probes /healthz (startup and liveness) and /readyz (readiness) there. vws-compute#156
    # (ff1252d) replaced internal/obs with vws-lib obs.Setup, which serves those paths only and
    # sends metrics over OTLP; the older image sha-1b62a87 still serves /metrics too. The chart
    # renders no scrape annotations: /metrics is gone from the current compute build. The OTLP
    # endpoint comes from observability (#50). /readyz follows the same verdict as
    # grpc.health.v1, so a dependency outage marks the pod unready instead of restarting it.
    healthPort: 8081
    # The KubeVirt agent and its flags are on vws-compute main (vws-compute#23, #44); the image
    # default -hypervisor=fake keeps no VM anywhere (#121). -storage is the vws-storage address
    # CreateInstance checks volumes against; empty answers DEPENDENCY_MISSING (cmd/vws-compute/config.go).
    flags:
      listen: 0.0.0.0:50051
      namespace: {namespace: release}
      hypervisor: kubevirt
      vm-namespace: {namespace: vms}
      image-namespace: {namespace: images}
      storage: storage:7400
    rbac:
    - namespace: vms
      apiGroups: [kubevirt.io]
      resources: [virtualmachines]
      verbs: [get, list, create, patch, delete]
    # get: the READY check reads the VMI phase (vws-compute#50); without it a running instance
    # stays RECONCILING (#121). delete: agent.go update, reboot deletes the VMI.
    - namespace: vms
      apiGroups: [kubevirt.io]
      resources: [virtualmachineinstances]
      verbs: [get, delete]
    # get: volumes.go checkAttachable reads a volume claim's access modes before attach and boot,
    # and the health check gets a probe claim in the VM namespace (#121). delete: instance destroy
    # removes the root claim (vws-compute#105).
    - namespace: vms
      apiGroups: [""]
      resources: [persistentvolumeclaims]
      verbs: [get, delete]
    # vws-compute#105 instance destroy deletes the root DataVolume in the VM namespace; get reads
    # it before delete, and no list or watch is used.
    - namespace: vms
      apiGroups: [cdi.kubevirt.io]
      resources: [datavolumes]
      verbs: [get, delete]
    # vws-compute#96, #144: CreateImage from a volume or machine clones a PVC in the VM namespace
    # into an image DataVolume in the images namespace. CDI authorizes the clone with a
    # SubjectAccessReview for create on datavolumes/source in the source namespace (vws-deploy#617).
    - namespace: vms
      apiGroups: [cdi.kubevirt.io]
      resources: [datavolumes/source]
      verbs: [create]
    # vws-compute#73, #89 cloudinit.go: a machine's cloud-init user data is Secret <instance>-cloudinit
    # (cloudInitNoCloud.secretRef) and its SSH keys are Secret <instance>-ssh-keys (accessCredentials).
    # Both go through ensureSecret and deleteSecret. create: before the VM; get and update: a retried
    # create; delete: destroy, after the VM. The client is uncached (client.New), so no list or watch.
    # No resourceNames: the names are per instance, and RBAC cannot limit create by name anyway;
    # compute itself touches only Secrets with its managed label.
    - namespace: vms
      apiGroups: [""]
      resources: [secrets]
      verbs: [get, create, update, delete]
    - namespace: images
      apiGroups: [cdi.kubevirt.io]
      resources: [datavolumes]
      verbs: [get, create, delete]
    # image_auth.go AuthorizeImages (vws-compute#93, a31223a) lists managed DataSources
    # on every sweep and merge-patches their authorization labels. The client is uncached,
    # so this rule has list and patch and no watch.
    - namespace: images
      apiGroups: [cdi.kubevirt.io]
      resources: [datasources]
      verbs: [get, list, create, patch, delete]
    - namespace: images
      apiGroups: [""]
      resources: [persistentvolumeclaims]
      verbs: [get]
    - namespace: release
      apiGroups: [""]
      resources: [configmaps]
      verbs: [get, list, create, update, delete]
    state:
      size: 20Gi
  storage:
    external: true
    # imageTag pins storage to vws-storage 070b210 (main, 2026-11-09), a build with vws-lib v0.3.0
    # (opt-in Prometheus /metrics). An anonymous manifest request returned HTTP 200 and
    # sha256:1028f0e2df19f3d02d197a6164ba14547ebf7e87953276a44d23db0b013473a4 on 2026-11-09. Every
    # flag below is in its cmd/vws-storage/main.go. spec.version does not move it.
    imageTag: sha-070b210
    port: 7400
    # healthPort is the vws-lib obs health listener (VWS_HEALTH_ADDR). /healthz says only that the
    # process runs; /readyz is internal/health Monitor.Ready, the same aggregate (engine, store, kube)
    # as the gRPC vws.storage.v1.Ready readiness it replaces. 7401 is taken by -fake-object-addr.
    # scrapeMetrics admits it only from global.metricsScraper (#620).
    healthPort: 7402
    scrapeMetrics: true
    flags:
      listen: 0.0.0.0:7400
      # The sqlite file lives on the retained state volume. Empty -db is an in-memory store that
      # loses every volume and snapshot record on restart (#85).
      db: /var/lib/vws/storage.db
      block-backend: kube
      kube-namespace: {namespace: vms}
      kube-class-standard: ceph-block
      kube-class-ssd: ceph-block
      kube-snapshot-class: ceph-block
    # Object backend (#90). enabled -> -object-backend=s3 -s3-profile=rgw -s3-endpoint=<endpoint>, and
    # env VWS_S3_ACCESS_KEY / VWS_S3_SECRET_KEY from secretKeyRef of existingSecret (keys access-key,
    # secret-key) in the release namespace. The operator makes that Secret; no key is ever in values.
    # bucketPrefix renders -s3-bucket-prefix=<prefix> (vws-storage#46): buckets are <prefix>-vws-<hash>.
    # The render fails when enabled with an empty endpoint or existingSecret.
    s3:
      rgw:
        enabled: false
        endpoint: ""
        bucketPrefix: ""
        existingSecret: ceph-rgw-s3
    rbac:
    # readiness gets these cluster-scoped objects (vws-storage#39 internal/backend/kube/ready.go).
    - apiGroups: [""]
      resources: [namespaces]
      verbs: [get]
    - apiGroups: [storage.k8s.io]
      resources: [storageclasses]
      verbs: [get]
    - apiGroups: [snapshot.storage.k8s.io]
      resources: [volumesnapshotclasses]
      verbs: [get]
    - namespace: vms
      apiGroups: [""]
      resources: [persistentvolumeclaims]
      verbs: [get, create, update, delete]
    - namespace: vms
      apiGroups: [snapshot.storage.k8s.io]
      resources: [volumesnapshots]
      verbs: [get, create, delete]
    # list: Volume status.instance reads the managed VirtualMachines that use a claim (vws-storage#68
    # internal/backend/kube/attach.go, one uncached List per Get/List; no get, no watch) (#123).
    - namespace: vms
      apiGroups: [kubevirt.io]
      resources: [virtualmachines]
      verbs: [list]
    # image volume: a CDI DataVolume in the VM namespace clones the image DataSource from the
    # images namespace (vws-storage#86, #201). datavolumes/source create is CDI's clone authorization.
    - namespace: vms
      apiGroups: [cdi.kubevirt.io]
      resources: [datavolumes]
      verbs: [get, create, delete]
    - namespace: images
      apiGroups: [cdi.kubevirt.io]
      resources: [datasources]
      verbs: [get]
    - namespace: images
      apiGroups: [cdi.kubevirt.io]
      resources: [datavolumes/source]
      verbs: [create]
    state:
      size: 20Gi
  network:
    external: true
    # TEMPORARY: to use the Kube-OVN dataplane today, add kubeconfigSecret (the name of a Secret you
    # created with one key, the kubeconfig) and flags.kubeconfig (the file path; its directory is the
    # read-only mount). The chart never creates that Secret and no credential goes in values.
    # The target is the in-cluster ServiceAccount, see docs/service-config.md.
    # imageTag pins network to vws-network 3890d27 (vws-network#166, 2026-11-09), the first build
    # with vws-lib v0.3.0 (opt-in Prometheus /metrics). An anonymous manifest request returned
    # HTTP 200 and sha256:93f34fe50c8870d6b3f7425778192dce733dc64bd492eb124d73a04b299fba92 on
    # 2026-11-09. Every flag below is in its cmd/vws-network/main.go. spec.version does not move it.
    imageTag: sha-3890d27
    port: 8080
    # healthPort is the vws-lib obs health listener (VWS_HEALTH_ADDR): /healthz, /readyz (svc.Ready,
    # the same check as its grpc.health.v1) and, with OTEL_METRICS_EXPORTER=prometheus, /metrics.
    # scrapeMetrics admits it only from global.metricsScraper (#620). Kubelet probes come from the
    # node IP, which Kube-OVN (KUBEOVN_VERSION) allows into every pod under a NetworkPolicy (CreateNodeACL).
    healthPort: 8081
    scrapeMetrics: true
    flags:
      listen: 0.0.0.0:8080
      # The sqlite file lives on the retained state volume mounted at /var/lib/vws.
      db: /var/lib/vws/network.db
      # pool (the elastic IP pool CIDR) has no default: set it per site. vws render fails without it.
      # Nodes kept at ovn.kubernetes.io/external-gw=true (vws-network -kube-gateway-nodes, comma
      # separated). Empty leaves the labels alone. vws render fills it from
      # spec.network.nodes.external.gatewayNodes (#197); no node name is written here.
      kube-gateway-nodes: ""
      # Instance VMIs live in the vms namespace; an address attached to an instance reads the VMI
      # interface IP there for the OvnFip (vws-network#87, docs/rbac.md).
      kube-vm-namespace: {namespace: vms}
    rbac:
    - apiGroups: [kubeovn.io]
      resources: [vpcs, subnets, ovn-eips, ovn-snat-rules]
      verbs: [get, create, delete]
    # rehomeGateway lists the VPC's subnets to move the NAT gateway (vws-network
    # internal/network/dataplane_kubeovn_snat.go firstOtherSubnet); its get/delete/create of
    # vpc-nat-gateways are below. Missing list failed on vws-test (#164).
    - apiGroups: [kubeovn.io]
      resources: [subnets]
      verbs: [list]
    # External gateway node labels (ovn.kubernetes.io/external-gw): vws-network reconciles them
    # and re-applies them after kube-ovn-controller resets them (#164).
    - apiGroups: [""]
      resources: [nodes]
      verbs: [get, patch]
    - apiGroups: [kubeovn.io]
      resources: [security-groups]
      verbs: [get, create, update, delete]
    - apiGroups: [kubeovn.io]
      resources: [ovn-fips]
      verbs: [get, list, create, delete]
    - apiGroups: [kubeovn.io]
      resources: [vpc-nat-gateways]
      verbs: [get, create, delete]
    # vws-network creates the external underlay at start and never deletes it (vws-network docs/underlay.md).
    - apiGroups: [kubeovn.io]
      resources: [provider-networks, vlans]
      verbs: [get, create]
    - namespace: nad
      apiGroups: [k8s.cni.cncf.io]
      resources: [network-attachment-definitions]
      verbs: [get, create, delete]
    # VMI interface IP for an address attached to an instance (-kube-vm-namespace, vws-network#87).
    - namespace: vms
      apiGroups: [kubevirt.io]
      resources: [virtualmachineinstances]
      verbs: [get, list, watch]
    state:
      size: 20Gi
