{{/*
One bundle per key in the services map: ServiceAccount, Service, workload, PDB.
state present -> StatefulSet, one retained volume, headless peers Service.
state absent -> Deployment, at least two replicas.
rbac present -> API token, a Lease Role for leader election, and the listed rules:
a rule with a namespace becomes a Role and RoleBinding in that namespace, a rule without one goes into a ClusterRole.
A rule's namespace is a key of values namespaces ("release" is the release namespace). Every such
namespace except the release one is rendered once and kept on uninstall.
flags -> container args, one -name=value each; pendingFlags are added only when global.pendingFlags is true.
Image is <global.registry>/<name>:<Chart.appVersion>, written once below.
*/}}
{{- $namespaces := dict }}
{{- range $name := keys .Values.services | sortAlpha }}
  {{- range (index $.Values.services $name).rbac }}
    {{- if and .namespace (ne .namespace "release") }}{{ $_ := set $namespaces (include "vws.ns" (dict "root" $ "key" .namespace)) true }}{{ end }}
  {{- end }}
{{- end }}
{{- range $ns := keys $namespaces | sortAlpha }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: vws
{{- end }}
{{- range $name := keys .Values.services | sortAlpha }}
{{- $spec := index $.Values.services $name }}
{{- $stateful := hasKey $spec "state" }}
{{- $replicas := $spec.replicas | default (ternary 1 2 $stateful) }}
{{- $port := int ($spec.port | default 8080) }}
{{- $external := $spec.external | default false }}
{{- $cpu := $spec.cpu | default "100m" }}
{{- $memory := $spec.memory | default "256Mi" }}
{{- $startup := int ($spec.startupSeconds | default 60) }}
{{- /* Kubelet probes at t=0 and then every 5s, and kills at (threshold-1)*5. */}}
{{- $threshold := add (div (add $startup 4) 5) 1 }}
{{- $image := printf "%s/%s:%s" $.Values.global.registry $name ($.Values.global.tag | default $.Chart.AppVersion) }}
{{- $rbac := hasKey $spec "rbac" }}
{{- $args := include "vws.args" (dict "root" $ "spec" $spec) | fromJsonArray }}
{{- /* kubeconfigSecret: a Secret the operator created, mounted read-only at the directory of the
 kubeconfig flag. The chart never renders a Secret and no credential is in values. Temporary, see docs/service-config.md. */}}
{{- $kube := dict }}
{{- if $spec.kubeconfigSecret }}
  {{- $path := required (printf "services.%s.kubeconfigSecret needs flags.kubeconfig" $name) (get ($spec.flags | default dict) "kubeconfig") }}
  {{- $kube = dict "secret" $spec.kubeconfigSecret "dir" (dir $path) "key" (base $path) }}
{{- end }}
{{- /* A service with grpcReadinessService gets gRPC probes, readiness on that name. The image
implements grpc.health.v1 (vws-storage#39, merged), so no gate (#110). */}}
{{- $grpcReady := $spec.grpcReadinessService | default "" }}
{{- $rgw := ($spec.s3 | default dict).rgw | default dict }}
{{- $rgwSecret := "" }}{{ if $rgw.enabled }}{{ $rgwSecret = $rgw.existingSecret }}{{ end }}
{{- $apiSecret := "" }}{{ with $spec.apiCredentials }}{{ $apiSecret = .existingSecret }}{{ end }}
{{- /* apiClient: the URL and the token Secret come from the named service's own values, so a
renamed service, release namespace or port moves with it. */}}
{{- $apiClient := dict }}
{{- with $spec.apiClient }}
  {{- $target := required (printf "services.%s.apiClient.service %s is not a service" $name .service) (get $.Values.services .service) }}
  {{- $targetSecret := required (printf "services.%s.apiClient.service %s has no apiCredentials.existingSecret" $name .service) (($target.apiCredentials | default dict).existingSecret) }}
  {{- $apiClient = dict "url" (printf "http://%s.%s.svc:%d" .service $.Release.Namespace (int ($target.port | default 8080))) "secret" $targetSecret }}
{{- end }}
{{- $ctx := dict "apiSecret" $apiSecret "apiClient" $apiClient "rgwSecret" $rgwSecret "grpcReady" $grpcReady "kube" $kube "args" $args "rbac" $rbac "name" $name "root" $ "stateful" $stateful "port" $port "cpu" $cpu "memory" $memory "threshold" $threshold "image" $image }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
automountServiceAccountToken: {{ $rbac }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" $external }}
  selector:
    {{- include "vws.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- if $stateful }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-peers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: true
  selector:
    {{- include "vws.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  serviceName: {{ $name }}-peers
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    {{- include "vws.podTemplate" $ctx | nindent 4 }}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "vws.selector" $ctx | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $spec.state.size }}
        {{- with $.Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    {{- include "vws.podTemplate" $ctx | nindent 4 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  # One replica cannot refuse eviction. This budget lets the node drain;
  # the retained claim is what survives the restart.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
{{- if $rbac }}
{{- $cluster := list }}
{{- $byNamespace := dict }}
{{- range $spec.rbac }}
  {{- if .namespace }}
    {{- $target := include "vws.ns" (dict "root" $ "key" .namespace) }}
    {{- $byNamespace = set $byNamespace $target (append (get $byNamespace $target | default (list)) (omit . "namespace")) }}
  {{- else }}
    {{- $cluster = append $cluster . }}
  {{- end }}
{{- end }}
{{- if $cluster }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  {{- toYaml $cluster | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $ns := keys $byNamespace | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  {{- toYaml (get $byNamespace $ns) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
