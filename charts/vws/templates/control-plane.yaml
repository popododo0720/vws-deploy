{{/*
One bundle per key in the services map: ServiceAccount, Service, workload, PDB.
state present -> StatefulSet, one retained volume, headless peers Service.
loopback -> StatefulSet with one replica and no volume, so its pod is always <name>-0, and Role
<name>-portforward for that pod only (#391).
otherwise -> Deployment, at least two replicas.
rbac present -> API token, a Lease Role for leader election, and the listed rules:
a rule with a namespace becomes a Role and RoleBinding in that namespace, a rule without one goes into a ClusterRole.
A rule's namespace is a key of values namespaces ("release" is the release namespace). Every such
namespace except the release one is rendered once and kept on uninstall.
flags -> container args, one -name=value each; pendingFlags are added only when global.pendingFlags is true.
repeatedFlags -> one -name=item arg per list item, after flags (a flag such as -kube-volume-type given once per value).
Image is <global.registry>/<name>:<tag>, written once below. tag is the service's imageTag, else
global.tag, else Chart.appVersion (vws-deploy#280).
*/}}
{{- $namespaces := dict }}
{{- range $name := keys .Values.services | sortAlpha }}
  {{- if ne (index $.Values.services $name).enabled false }}
  {{- range (index $.Values.services $name).rbac }}
    {{- if and .namespace (ne .namespace "release") }}{{ $_ := set $namespaces (include "vws.ns" (dict "root" $ "key" .namespace)) true }}{{ end }}
  {{- end }}
  {{- end }}
{{- end }}
{{- range $ns := keys $namespaces | sortAlpha }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/part-of: vws
{{- end }}
{{- $iamSpec := index $.Values.services "iam" | default dict }}
{{- $iamEnabled := true }}
{{- if and (hasKey $iamSpec "enabled") (not $iamSpec.enabled) }}
  {{- $iamEnabled = false }}
{{- end }}
{{- $iamPort := int ($iamSpec.port | default 9095) }}
{{- range $name := keys .Values.services | sortAlpha }}
{{- $spec := index $.Values.services $name }}
{{- /* enabled false: a service whose image is not published yet stays out of the render (#243). */}}
{{- if ne $spec.enabled false }}
{{- $stateful := hasKey $spec "state" }}
{{- $port := int ($spec.port | default 8080) }}
{{- $healthPort := int ($spec.healthPort | default 0) }}
{{- if and $healthPort (eq $healthPort $port) }}
  {{- fail (printf "R15: services.%s.healthPort must differ from port %d" $name $port) }}
{{- end }}
{{- $external := $spec.external | default false }}
{{- /* loopback (the admin page, #391): the service listens on 127.0.0.1 and has no auth, so it gets no
Service and its NetworkPolicy admits only the health port. Nothing that opens it up may be set. */}}
{{- $loopback := $spec.loopback | default false }}
{{- if and $loopback (or $external $spec.allowFrom $spec.scrapeMetrics $spec.httpProbes $spec.state $spec.portEnv (not $healthPort) (ne (int ($spec.replicas | default 1)) 1)) }}
  {{- fail (printf "R10: services.%s.loopback needs healthPort, one replica and none of external, allowFrom, scrapeMetrics, httpProbes, state, portEnv" $name) }}
{{- end }}
{{- $replicas := $spec.replicas | default (ternary 1 2 (or $stateful $loopback)) }}
{{- $cpu := $spec.cpu | default "100m" }}
{{- $memory := $spec.memory | default "256Mi" }}
{{- $startup := int ($spec.startupSeconds | default 60) }}
{{- /* Kubelet probes at t=0 and then every 5s, and kills at (threshold-1)*5. */}}
{{- $threshold := add (div (add $startup 4) 5) 1 }}
{{- $image := printf "%s/%s:%s" $.Values.global.registry ($spec.imageName | default $name) ($spec.imageTag | default ($.Values.global.tag | default $.Chart.AppVersion)) }}
{{- $rbac := hasKey $spec "rbac" }}
{{- $args := include "vws.args" (dict "root" $ "spec" $spec "iamEnabled" $iamEnabled "iamPort" $iamPort) | fromJsonArray }}
{{- $extraPorts := include "vws.extraPorts" (dict "flags" ($spec.flags | default dict) "port" $port) | fromJsonArray }}
{{- /* kubeconfigSecret: a Secret the operator created, mounted read-only at the directory of the
 kubeconfig flag. The chart never renders a Secret and no credential is in values. Temporary, see docs/service-config.md. */}}
{{- $kube := dict }}
{{- if $spec.kubeconfigSecret }}
  {{- $path := required (printf "services.%s.kubeconfigSecret needs flags.kubeconfig" $name) (get ($spec.flags | default dict) "kubeconfig") }}
  {{- $kube = dict "secret" $spec.kubeconfigSecret "dir" (dir $path) "key" (base $path) }}
{{- end }}
{{- /* A service with grpcReadinessService gets gRPC probes, readiness on that name. The image
implements grpc.health.v1 (vws-storage#39, merged), so no gate (#110). */}}
{{- $grpcReady := $spec.grpcReadinessService | default "" }}
{{- $rgw := ($spec.s3 | default dict).rgw | default dict }}
{{- $rgwSecret := "" }}{{ if $rgw.enabled }}{{ $rgwSecret = $rgw.existingSecret }}{{ end }}
{{- $rootPassword := "" }}
{{- if has (printf "-root-password-file=%s" (include "vws.rootPasswordFile" .)) $args }}{{ $rootPassword = $spec.rootPasswordSecret }}{{ end }}
{{- $apiSecret := "" }}{{ with $spec.apiCredentials }}{{ $apiSecret = .existingSecret }}{{ end }}
{{- /* apiClient: the URL and the token Secret come from the named service's own values, so a
renamed service, release namespace or port moves with it. */}}
{{- $apiClient := dict }}
{{- with $spec.apiClient }}
  {{- $target := required (printf "services.%s.apiClient.service %s is not a service" $name .service) (get $.Values.services .service) }}
  {{- $targetSecret := required (printf "services.%s.apiClient.service %s has no apiCredentials.existingSecret" $name .service) (($target.apiCredentials | default dict).existingSecret) }}
  {{- $apiClient = dict "url" (printf "http://%s.%s.svc:%d" .service $.Release.Namespace (int ($target.port | default 8080))) "secret" $targetSecret }}
{{- end }}
{{- $httpProbes := $spec.httpProbes | default false }}
{{- if and $httpProbes $healthPort }}
  {{- fail (printf "R15: services.%s sets both httpProbes and healthPort" $name) }}
{{- end }}
{{- $ctx := dict "portEnv" ($spec.portEnv | default "") "healthPort" $healthPort "httpProbes" $httpProbes "apiSecret" $apiSecret "kekSecret" ($spec.kekSecret | default "") "apiClient" $apiClient "rgwSecret" $rgwSecret "grpcReady" $grpcReady "kube" $kube "rootPassword" $rootPassword "args" $args "rbac" $rbac "name" $name "root" $ "stateful" $stateful "port" $port "cpu" $cpu "memory" $memory "threshold" $threshold "image" $image "observability" ($spec.observability | default dict) "command" ($spec.command | default list) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
automountServiceAccountToken: {{ $rbac }}
{{- if not $loopback }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  type: {{ ternary "LoadBalancer" "ClusterIP" $external }}
  selector:
    {{- include "vws.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- range $extra := $extraPorts }}
    - name: {{ $extra.name }}
      port: {{ int $extra.port }}
      targetPort: {{ int $extra.port }}
{{- end }}
{{- /* R15 (#623): an external (LoadBalancer) Service never publishes the health listener.
Probes and scrapers reach the metrics containerPort on the pod IP, and a NetworkPolicy does not stop
the load balancer from publishing the port, so only an in-cluster Service carries it. */}}
{{- if and $healthPort (not $external) }}
    - name: metrics
      port: {{ $healthPort }}
      targetPort: metrics
{{- end }}
{{- end }}
{{- if $stateful }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-peers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  clusterIP: "None"
  publishNotReadyAddresses: true
  selector:
    {{- include "vws.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- if $healthPort }}
    - name: metrics
      port: {{ $healthPort }}
      targetPort: metrics
{{- end }}
{{- end }}
{{- if or $stateful $loopback }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  {{- if $stateful }}
  serviceName: {{ $name }}-peers
  {{- end }}
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
  {{- if $stateful }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  template:
    {{- include "vws.podTemplate" $ctx | nindent 4 }}
  {{- if $stateful }}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "vws.selector" $ctx | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $spec.state.size }}
        {{- with $.Values.global.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
  strategy:
    {{- if eq (int $replicas) 1 }}
    {{- /* maxSurge 1 on one replica runs two pods and splits console-api sessions (#279). */}}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- end }}
  template:
    {{- include "vws.podTemplate" $ctx | nindent 4 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  # One replica cannot refuse eviction. This budget lets the node drain;
  # the retained claim is what survives the restart.
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
{{- /* loopback: the operator reaches the page with kubectl port-forward, which goes through the
kubelet and no NetworkPolicy, so the grant names the one pod. No RoleBinding: the cluster admin binds
the Role to the people who run the page (docs/vwscluster.md). */}}
{{- if $loopback }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-portforward
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: [{{ printf "%s-0" $name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    resourceNames: [{{ printf "%s-0" $name | quote }}]
    verbs: ["create"]
{{- end }}
{{- if $rbac }}
{{- $cluster := list }}
{{- $byNamespace := dict }}
{{- range $spec.rbac }}
  {{- $rule := include "vws.rule" (dict "root" $ "rule" .) | fromJson }}
  {{- if .namespace }}
    {{- $target := include "vws.ns" (dict "root" $ "key" .namespace) }}
    {{- $byNamespace = set $byNamespace $target (append (get $byNamespace $target | default (list)) (omit $rule "namespace")) }}
  {{- else }}
    {{- $cluster = append $cluster $rule }}
  {{- end }}
{{- end }}
{{- if $cluster }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  {{- toYaml $cluster | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $ns := keys $byNamespace | sortAlpha }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  {{- toYaml (get $byNamespace $ns) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-{{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-leader
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-leader
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- /* One NetworkPolicy per service with allowFrom, scrapeMetrics or loopback (#243, #620, #391). loopback
admits only healthPort, from every source, because kubelet probes come from the node and the page port
(127.0.0.1) is not reachable from a pod anyway. allowFrom
limits the service port to those services' pods. scrapeMetrics limits the health listener, which
serves /metrics (vws-lib obs), to global.metricsScraper; without allowFrom the service and extra
ports stay open to every source, so the policy changes only who reaches /metrics. */}}
{{- $scrape := $spec.scrapeMetrics | default false }}
{{- if and $scrape (not $healthPort) }}
  {{- fail (printf "R10: services.%s.scrapeMetrics needs healthPort" $name) }}
{{- end }}
{{- if or $spec.allowFrom $scrape $loopback }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vws.selector" $ctx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- with $spec.allowFrom }}
    - from:
        {{- range . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
      ports:
        - port: {{ $port }}
    {{- else }}
    {{- if $loopback }}
    - ports:
        - port: {{ $healthPort }}
    {{- else }}
    - ports:
        - port: {{ $port }}
        {{- range $extra := $extraPorts }}
        - port: {{ int $extra.port }}
        {{- end }}
    {{- end }}
    {{- end }}
    {{- if $scrape }}
    {{- $scraper := required "R10: scrapeMetrics needs global.metricsScraper" $.Values.global.metricsScraper }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "vws.ns" (dict "root" $ "key" $scraper.namespace) }}
          podSelector:
            matchLabels:
              {{- toYaml $scraper.podLabels | nindent 14 }}
      ports:
        - port: {{ $healthPort }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Minimal OTel collector (vws-deploy#50): only when observability is on and otlpEndpoint is
empty. One Deployment, OTLP in, memory_limiter and batch, otlp (bounded retry and queue) and debug
out. It reads no Kubernetes API (no token, no Role) and mounts only its config. Cluster and host
collection are examples in docs/observability/collector-examples, never rendered. */}}
{{- $obs := .Values.observability | default dict }}
{{- if and $obs.enabled (not $obs.otlpEndpoint) }}
{{- $c := $obs.collector }}
{{- $next := $c.exporters.otlp }}
{{- $exporters := list }}
{{- if $next.endpoint }}{{ $exporters = append $exporters "otlp" }}{{ end }}
{{- if $c.exporters.debug.enabled }}{{ $exporters = append $exporters "debug" }}{{ end }}
{{- if not $exporters }}
  {{- fail "observability.collector needs exporters.otlp.endpoint or exporters.debug.enabled" }}
{{- end }}
{{- if and $next.authorizationSecret (not $next.endpoint) }}
  {{- fail "observability.collector.exporters.otlp.authorizationSecret needs exporters.otlp.endpoint" }}
{{- end }}
{{- $octx := dict "root" $ "name" "otel-collector" }}
{{- $config := include "vws.collectorConfig" (dict "c" $c "exporters" $exporters) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.collectorLabels" $octx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.collectorLabels" $octx | nindent 4 }}
data:
  config.yaml: |
    {{- $config | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.collectorLabels" $octx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vws.selector" $octx | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.collectorLabels" $octx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vws.selector" $octx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "vws.collectorLabels" $octx | nindent 8 }}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      restartPolicy: Always
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: {{ $c.image }}
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          {{- with $next.authorizationSecret }}
          env:
            - name: OTLP_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: authorization
          {{- end }}
          startupProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 13
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: {{ $c.cpu }}
              memory: {{ $c.memory }}
            limits:
              memory: {{ $c.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.collectorLabels" $octx | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vws.selector" $octx | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: vws
              app.kubernetes.io/instance: {{ $.Release.Name }}
      ports:
        - port: 4317
        - port: 4318
{{- end }}
{{- /* vws-volume-types: the EBS volume type mapping, built from storage's -kube-volume-type list so the
two cannot drift. One key per mapped type, value CLASS[/MODE[/SNAPSHOTCLASS]]. It renders with empty
data when nothing is mapped, because the admin page may update it but not create it
(docs/design/admin-volume-types.md, vws-deploy#391). */}}
{{- $storage := index .Values.services "storage" }}
{{- if and $storage (ne $storage.enabled false) }}
{{- $types := index ($storage.repeatedFlags | default dict) "kube-volume-type" | default list }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vws-volume-types
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "vws.labels" (dict "root" $ "name" "storage") | nindent 4 }}
{{- if $types }}
data:
  {{- range $types }}
  {{ regexFind "^[^=]*" . }}: {{ regexReplaceAll "^[^=]*=" . "" | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
