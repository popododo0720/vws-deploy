# A lab install on one node. No data protection (one Ceph copy).
apiVersion: vws.popododo0720.io/v1alpha1
kind: VWSCluster
metadata:
  name: vws
  namespace: vws
spec:
  profile: single-node
  storage:
    driver: rook-ceph
  network:
    driver: kube-ovn
  services:
    network:
      flags:
        pool: 198.18.0.0/24
    console-api:
      flags:
        console-origins: https://console.example.invalid
