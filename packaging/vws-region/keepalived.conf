global_defs {
    enable_script_security
    script_user root
}

vrrp_script vws_region_ready {
    script "/usr/lib/vws/check-region-ready"
    interval 2
    timeout 3
    fall 1
    rise 2
    weight 0
    init_fail
}

vrrp_instance VWS_REGION {
    state BACKUP
    interface vmbr0
    virtual_router_id 83
    priority 100
    advert_int 1
    virtual_ipaddress {
        192.0.2.10/24 dev vmbr0
    }
    track_script {
        vws_region_ready
    }
}
