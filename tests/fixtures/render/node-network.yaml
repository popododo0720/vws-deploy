# spec.network of a 4-NIC node with two direct networks (vws-deploy#125). render.test.sh puts it
# into a copy of examples/vwscluster/ha.yaml.
driver: kube-ovn
nodes:
  management: {nic: enp1s0, cidr: 10.77.0.0/24}
  tunnel: {nic: enp2s0, vlan: 20, cidr: 10.20.0.0/24, mtu: 9000}
  storage:
    public: {nic: enp3s0, cidr: 10.30.0.0/24, mtu: 9000}
    cluster: {nic: enp3s0, vlan: 31, cidr: 10.31.0.0/24, mtu: 9000}
  external:
    nic: enp4s0
    vlan: 100
    cidr: 198.18.10.0/24
    gateway: 198.18.10.1
    excludeIPs: [198.18.10.1..198.18.10.9]
    eipPool: 198.18.10.64/26
direct:
  - {name: prod, nic: enp4s0, vlan: 200, cidr: 192.168.200.0/24, gateway: 192.168.200.1}
  - {name: lab, nic: enp4s0, cidr: 192.168.10.0/24, gateway: 192.168.10.1, excludeIPs: [192.168.10.1..192.168.10.20]}
